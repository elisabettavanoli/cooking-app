# Cloudflare Workers static-assets deploy (`npx wrangler deploy`).
# Assets-only Worker: no server code, just the built SPA in dist/.
name = "cooking-app"
compatibility_date = "2026-09-03"

[assets]
directory = "./dist"
# Serve index.html for unknown paths so deep links / hard refresh don't 404.
not_found_handling = "single-page-application"
